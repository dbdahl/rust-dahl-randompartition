[package]
name = "dahl-randompartition"
version = "0.1.0"
authors = ["David B. Dahl <dahl@stat.byu.edu>"]
edition = "2024"
description = "An efficient representation of a set partition."
homepage = "https://dahl.byu.edu"
license = "MIT OR Apache-2.0"
rust-version = "1.85.1"

[dependencies]
rand = "0.10.0"
rand_pcg = "0.10.0"
rand_distr = "0.6.0"
statrs = "0.18.0"

dahl-bellnumber = "0.1.4" 
dahl-salso = "0.8.0"

slice_sampler = { git="https://github.com/dbdahl/rust_slice_sampler.git", rev="407d5a3" }
fastrand = "2.0"
