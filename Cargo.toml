[package]
name = "dahl-randompartition"
version = "0.1.0"
authors = ["David B. Dahl <dahl@stat.byu.edu>"]
edition = "2024"
description = "An efficient representation of a set partition."
homepage = "https://dahl.byu.edu"
license = "MIT OR Apache-2.0"
rust-version = "1.85.1"

[dependencies]
rand = "0.10.0"
rand_pcg = "0.10.0"
rand_distr = "0.6.0"
statrs = "0.18.0"

dahl-bellnumber = { git="https://github.com/dbdahl/rust-dahl-bellnumber.git", rev="792af17" }
# dahl-bellnumber = { path="/home/dahl/docs/devel/rust-dahl-bellnumber" }

# dahl-salso = "0.6.6"
dahl-salso = { git="https://github.com/dbdahl/rust-dahl-salso.git", rev="cdabc9c" }
# dahl-salso = { path="/home/dahl/docs/devel/rust-dahl-salso" }

slice_sampler = { git="https://github.com/dbdahl/rust_slice_sampler.git", rev="aa8f4ec" }
fastrand = "2.0"
